[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow"
version = "1.8.39"
description = "Decide what to drop from a Claude Code session transcript, and say whether dropping it paid"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ruya AI" },
    { name = "Junaid Qureshi" },
]
keywords = ["claude", "claude-code", "context", "pruning", "jsonl", "transcript", "prompt-cache", "agent-teams", "compaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
# psutil is the only backend that can read a process start time on a platform
# whose /proc and `ps -o lstart=` both fail, and the start time is what stops
# the guard SIGKILLing a recycled PID. It was a lazy import with a fail-open
# fallback, so a machine without it lost the check silently. The fallback now
# fails closed (guard.py `_pid_identity_match`); declaring it here is what keeps
# the closed path from being the normal one. docs/FORK.md §9.
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
# pytest is what the suite is written against. It was undeclared, so every run
# needed `uv run --with pytest`.
dev = [
    "pytest>=7.0",
]
# fastmcp is imported by plugin/servers/cozempic_mcp.py, and by nothing the CLI
# reaches. An extra rather than a hard dependency for that reason: `winnow list`
# should not pull an MCP framework. Phase 4 moves the server into an image and
# this becomes the image's dependency (docs/FORK.md §7).
mcp = [
    "fastmcp>=2.0",
]

[project.scripts]
winnow = "winnow.cli:main"

[project.urls]
Homepage = "https://github.com/Xapicc/winnow"
Repository = "https://github.com/Xapicc/winnow"
Issues = "https://github.com/Xapicc/winnow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"winnow.legacy" = ["data/*.md", "data/*.json"]

[tool.pytest.ini_options]
# Test against the working tree, not a stale installed wheel. Without this, a
# non-editable `pip install winnow` in the venv shadows src/ and a bare
# `pytest` silently runs the OLD code (false green/red). Keep src/ first.
pythonpath = ["src"]
testpaths = ["tests"]
